<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SchoolManager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f1f5f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .login-card { border: none; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        .btn-check:checked + .btn-outline-primary { background-color: #0052cc; border-color: #0052cc; color: white; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="card login-card p-4 p-md-5 style-card" style="width: 100%; max-width: 420px;">
        <div class="text-center mb-4">
            <i class="bi bi-mortarboard-fill text-primary display-4"></i>
            <h3 class="fw-bold text-dark mt-2">SchoolManager</h3>
            <p class="text-muted small">Acesse a sua conta para continuar</p>
        </div>

        <!-- Seletor Tipo de Utilizador -->
        <div class="btn-group w-100 mb-4" role="group">
            <input type="radio" class="btn-check" name="tipo_usuario" id="tipo-prof" value="professor" checked>
            <label class="btn btn-outline-primary fw-bold" for="tipo-prof"><i class="bi bi-person-badge me-1"></i> Professor</label>

            <input type="radio" class="btn-check" name="tipo_usuario" id="tipo-aluno" value="aluno">
            <label class="btn btn-outline-primary fw-bold" for="tipo-aluno"><i class="bi bi-person-fill me-1"></i> Aluno</label>
        </div>

        <form id="form-login" onsubmit="realizarLogin(event)">
            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">E-MAIL</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                    <input type="email" class="form-control bg-light border-start-0" id="email" required placeholder="exemplo@escola.com">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-muted small fw-bold">SENHA</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                    <input type="password" class="form-control bg-light border-start-0" id="senha" required placeholder="••••••••">
                </div>
            </div>

            <div id="erro-login" class="alert alert-danger py-2 small d-none mb-3"></div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                <i class="bi bi-box-arrow-in-right me-1"></i> Entrar no Sistema
            </button>
        </form>
    </div>

    <script>
        // Credenciais Fixas
        const credenciais = {
            professor: { email: "professor@escola.com", senha: "prof123", nome: "Rodolfo da Silva", perfil: "Professor" },
            aluno: { email: "aluno@escola.com", senha: "aluno123", nome: "Ana Clara Martins", perfil: "Aluno" }
        };

        function realizarLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value.trim();
            const tipo = document.querySelector('input[name="tipo_usuario"]:checked').value;
            const erroDiv = document.getElementById('erro-login');

            const conta = credenciais[tipo];

            if (email === conta.email && senha === conta.senha) {
                // Guarda a sessão do utilizador
                localStorage.setItem('usuario_logado', JSON.stringify({
                    nome: conta.nome,
                    perfil: conta.perfil,
                    tipo: tipo
                }));

                // Redirecionamento correto para ambos os perfis:
                if (tipo === 'professor') {
                    window.location.href = '/dashboard';
                } else {
                    window.location.href = '/aluno-dashboard';
                }
            } else {
                erroDiv.innerText = `Dados incorretos. Dica: Usar ${conta.email} / ${conta.senha}`;
                erroDiv.classList.remove('d-none');
            }
        }
    </script>
</body>
</html>
