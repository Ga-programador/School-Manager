<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Académica - SchoolManager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { min-height: 100vh; background: #ffffff; color: white; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid #e2e8f0; }
        .sidebar a { color: #64748b; text-decoration: none; padding: 12px 20px; display: block; border-radius: 8px; margin-bottom: 4px; font-weight: 500; }
        .sidebar a:hover, .sidebar a.active { background: #0052cc; color: white; }
        .sidebar a.btn-logout { color: #dc2626; border: 1px solid #fee2e2; background-color: #fef2f2; }
        .sidebar a.btn-logout:hover { background-color: #dc2626; color: white !important; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar p-3">
                <div>
                    <h4 class="fw-bold mb-4 text-primary"><i class="bi bi-mortarboard-fill me-2"></i>School Manager</h4>
                    <a href="/dashboard"><i class="bi bi-grid-1x2-fill me-2"></i>Visão Geral</a>
                    <a href="/gestao" class="active"><i class="bi bi-people-fill me-2"></i>Gestão Académica</a>
                    <a href="/lancamentos"><i class="bi bi-journal-check me-2"></i>Lançamentos (Notas/Freq.)</a>
                    <a href="/ia"><i class="bi bi-robot me-2"></i>Análise de IA (LLM)</a>
                </div>

                <!-- Botão Sair na Parte Inferior do Menu -->
                <div class="pt-3 border-top">
                    <a href="#" onclick="encerrarSessao()" class="btn-logout text-center fw-bold">
                        <i class="bi bi-box-arrow-right me-2"></i>Sair
                    </a>
                </div>
            </div>

            <!-- Conteúdo Principal -->
            <div class="col-md-10 p-4">
                
                <!-- Barra Superior com Identificação do Usuário -->
                <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded shadow-sm border">
                    <div>
                        <h2 class="fw-bold mb-0 text-dark">Gestão Académica</h2>
                        <p class="text-muted mb-0 small">Gerencie e cadastre os alunos das turmas</p>
                    </div>
                    <div class="d-flex align-items-center gap-3">
                        <div class="badge bg-light text-dark p-2 border fs-6 fw-normal">
                            <i class="bi bi-person-circle text-primary me-1"></i> 
                            <span id="identificacao-usuario" class="fw-bold">Professor / Rodolfo da Silva</span>
                        </div>
                        <button class="btn btn-primary fw-bold" onclick="abrirModalAluno()">
                            <i class="bi bi-person-plus-fill me-1"></i> Adicionar Aluno
                        </button>
                    </div>
                </div>

                <div class="card p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="d-flex align-items-center gap-2">
                            <label class="fw-bold text-muted small">FILTRAR TURMA:</label>
                            <select id="filtro-turma" class="form-select w-auto" onchange="renderizarTabela()">
                                <option value="todas">Todas as Turmas</option>
                                <option value="Turma A1">Turma A1 (1º Ano)</option>
                                <option value="Turma B2">Turma B2 (2º Ano)</option>
                                <option value="Turma C3">Turma C3 (3º Ano)</option>
                            </select>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Nome do Aluno</th>
                                    <th>E-mail</th>
                                    <th>Turma</th>
                                    <th class="text-end">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-alunos"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Novo / Editar Aluno -->
    <div class="modal fade" id="modalAluno" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modalTitle">Cadastrar Aluno</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="aluno-id">
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">NOME COMPLETO</label>
                        <input type="text" class="form-control" id="aluno-nome" placeholder="Ex: João Souza">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">E-MAIL</label>
                        <input type="email" class="form-control" id="aluno-email" placeholder="Ex: joao@escola.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">TURMA</label>
                        <select class="form-select" id="aluno-turma">
                            <option value="Turma A1">Turma A1 (1º Ano)</option>
                            <option value="Turma B2">Turma B2 (2º Ano)</option>
                            <option value="Turma C3">Turma C3 (3º Ano)</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary fw-bold" onclick="salvarAluno()">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let alunosBase = JSON.parse(localStorage.getItem('alunos_db')) || [
            { id: 1, nome: "Ana Silva", email: "ana.silva@escola.com", turma: "Turma A1" },
            { id: 2, nome: "Carlos Oliveira", email: "carlos.oliveira@escola.com", turma: "Turma A1" },
            { id: 3, nome: "Beatriz Santos", email: "beatriz.santos@escola.com", turma: "Turma A1" },
            { id: 4, nome: "Lucas Mendes", email: "lucas.mendes@escola.com", turma: "Turma A1" },
            { id: 5, nome: "Mariana Costa", email: "mariana.costa@escola.com", turma: "Turma B2" },
            { id: 6, nome: "Pedro Rocha", email: "pedro.rocha@escola.com", turma: "Turma B2" },
            { id: 7, nome: "Juliana Lima", email: "juliana.lima@escola.com", turma: "Turma B2" },
            { id: 8, nome: "Gabriel Ferraz", email: "gabriel.ferraz@escola.com", turma: "Turma B2" },
            { id: 9, nome: "Fernanda Alves", email: "fernanda.alves@escola.com", turma: "Turma C3" },
            { id: 10, nome: "Rafael Souza", email: "rafael.souza@escola.com", turma: "Turma C3" },
            { id: 11, nome: "Camila Ribeiro", email: "camila.ribeiro@escola.com", turma: "Turma C3" },
            { id: 12, nome: "Thiago Martins", email: "thiago.martins@escola.com", turma: "Turma C3" }
        ];
        let modalInstance = null;

        // Função para verificar se a sessão do usuário existe
        function checarSessao() {
            const usuario = JSON.parse(localStorage.getItem('usuario_logado'));
            if (!usuario) {
                window.location.href = '/login';
                return;
            }
            const elIdentificacao = document.getElementById('identificacao-usuario');
            if (elIdentificacao) {
                elIdentificacao.innerText = `${usuario.perfil} / ${usuario.nome}`;
            }
        }

        // Função de Logout
        function encerrarSessao() {
            localStorage.removeItem('usuario_logado');
            window.location.href = '/login';
        }

        function salvarStorage() {
            localStorage.setItem('alunos_db', JSON.stringify(alunosBase));
        }

        function renderizarTabela() {
            const tbody = document.getElementById('tabela-alunos');
            const filtro = document.getElementById('filtro-turma').value;
            const lista = filtro === 'todas'
                ? alunosBase
                : alunosBase.filter(a => a.turma === filtro);

            if (lista.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">Nenhum aluno encontrado para esta turma.</td></tr>';
                return;
            }

            tbody.innerHTML = lista.map(aluno => `
                <tr>
                    <td><span class="badge bg-secondary">#${aluno.id}</span></td>
                    <td class="fw-bold">${aluno.nome}</td>
                    <td>${aluno.email}</td>
                    <td><span class="badge bg-info text-dark">${aluno.turma}</span></td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="editarAluno(${aluno.id})"><i class="bi bi-pencil"></i></button>
                        <button class="btn btn-sm btn-outline-danger" onclick="excluirAluno(${aluno.id})"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function abrirModalAluno() {
            document.getElementById('aluno-id').value = '';
            document.getElementById('aluno-nome').value = '';
            document.getElementById('aluno-email').value = '';
            document.getElementById('modalTitle').innerText = 'Cadastrar Aluno';
            modalInstance = new bootstrap.Modal(document.getElementById('modalAluno'));
            modalInstance.show();
        }

        function editarAluno(id) {
            const aluno = alunosBase.find(a => a.id === id);
            if (!aluno) return;
            document.getElementById('aluno-id').value = aluno.id;
            document.getElementById('aluno-nome').value = aluno.nome;
            document.getElementById('aluno-email').value = aluno.email;
            document.getElementById('aluno-turma').value = aluno.turma;
            document.getElementById('modalTitle').innerText = 'Editar Aluno';
            modalInstance = new bootstrap.Modal(document.getElementById('modalAluno'));
            modalInstance.show();
        }

        function salvarAluno() {
            const id = document.getElementById('aluno-id').value;
            const nome = document.getElementById('aluno-nome').value.trim();
            const email = document.getElementById('aluno-email').value.trim();
            const turma = document.getElementById('aluno-turma').value;

            if (!nome || !email) return alert("Preencha todos os campos!");

            if (id) {
                const idx = alunosBase.findIndex(a => a.id == id);
                if (idx !== -1) alunosBase[idx] = { id: parseInt(id), nome, email, turma };
            } else {
                const novoId = alunosBase.length ? Math.max(...alunosBase.map(a => a.id)) + 1 : 1;
                alunosBase.push({ id: novoId, nome, email, turma });
            }

            salvarStorage();
            modalInstance.hide();
            renderizarTabela();
        }

        function excluirAluno(id) {
            if (confirm("Deseja realmente remover este aluno?")) {
                alunosBase = alunosBase.filter(a => a.id !== id);
                salvarStorage();
                renderizarTabela();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            checarSessao();
            renderizarTabela();
        });
    </script>
</body>
</html>
